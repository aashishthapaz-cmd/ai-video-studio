name: 🎬 Autonomous AI Video Studio & Auto-Poster

on:
  # 1. Scheduled Posting via Cron (Every 30 Minutes Queue Check)
  #    Wakes up every 30 minutes to check scheduled queue, resolve collisions,
  #    render & publish due videos, and send notifications + playable video to Telegram.
  schedule:
    - cron: '*/30 * * * *'   # Runs every 30 minutes (:00 and :30)

  # 2. Manual / Mobile Trigger via GitHub Web UI or GitHub App
  workflow_dispatch:
    inputs:
      script_text:
        description: 'Poem or Script text (Leave empty to process next queued post)'
        required: false
        type: string
        default: ''
      title:
        description: 'Video Title'
        required: false
        type: string
        default: ''
      custom_vibe:
        description: 'Visual Style & World'
        required: false
        type: string
        default: 'Typewriters Voice Nostalgia'
      poetry_niche:
        description: 'Poetry Niche (Tuned Art, Voice, Font & Tone)'
        required: false
        type: string
        default: 'Auto-Detect from Poem'
      target_page:
        description: 'Target Facebook Page (leave empty or "ALL Pages" = post to ALL enabled pages)'
        required: false
        type: string
        default: 'ALL Pages'
      publish_facebook:
        description: 'Publish automatically to connected Facebook Pages'
        required: false
        type: boolean
        default: true
      bulk_poems:
        description: |
          BULK MODE: Paste multiple poems separated by "---" (each posts to its page at scheduled times).
          Format: Title: My Poem\nTime: 2024-01-15 08:30\nPage: Typewriters Voice\n[poem text]
        required: false
        type: string
        default: ''
      bulk_start_time:
        description: 'Bulk: Start time for first post (e.g. "2024-01-15 08:30 EST")'
        required: false
        type: string
        default: ''
      bulk_interval:
        description: 'Bulk: Interval between posts (e.g. "1h", "2h", "3h", "4h", "6h", "12h", "24h", "peak_slots")'
        required: false
        type: string
        default: 'peak_slots'

  # 3. Webhook / Repository Dispatch Trigger (e.g. from Telegram Bot / External API)
  repository_dispatch:
    types: [generate_video, process_queue, bulk_schedule]

permissions:
  contents: write

concurrency:
  # Each manual dispatch gets its own unique run_id group → never cancelled.
  # Scheduled cron triggers share one 'scheduled-queue' group → no duplicate queue runs.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  render-and-publish:
    name: 🎥 Render 1080x1920 Video & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 🎬 Install FFmpeg, Virtual Display & Multi-Lingual Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            xvfb \
            libgl1-mesa-glx \
            libegl1 \
            fonts-dejavu-core \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-noto-extra \
            git \
            curl
          sudo mkdir -p /usr/local/share/fonts/custom
          sudo cp assets/fonts/*.ttf /usr/local/share/fonts/custom/ 2>/dev/null || true
          sudo fc-cache -fv

      - name: 📦 Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('cloud_generator/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 🧠 Cache Voice Cloning & Alignment Models (F5-TTS, XTTS, Whisper)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/cached_path
            ~/.local/share/tts
          key: ${{ runner.os }}-voice-models-v1
          restore-keys: |
            ${{ runner.os }}-voice-models-

      - name: 📦 Install Python Dependencies & Chromium Automation Engine
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud_generator/requirements.txt
          pip install playwright
          python -m playwright install chromium --with-deps
          # Expose Playwright Chromium to standard system paths for DrissionPage & Perchance
          PLAYWRIGHT_CHROME=$(find ~/.cache/ms-playwright/chromium-* -name chrome 2>/dev/null | head -n 1)
          if [ -n "$PLAYWRIGHT_CHROME" ] && [ -x "$PLAYWRIGHT_CHROME" ]; then
            echo "Found Playwright Chromium at: $PLAYWRIGHT_CHROME"
            sudo ln -sf "$PLAYWRIGHT_CHROME" /usr/bin/google-chrome
            sudo ln -sf "$PLAYWRIGHT_CHROME" /usr/bin/chromium
            sudo ln -sf "$PLAYWRIGHT_CHROME" /usr/bin/chromium-browser
            sudo chmod +x "$PLAYWRIGHT_CHROME"
          else
            echo "Playwright Chromium not found in cache, installing chromium-browser via apt..."
            sudo apt-get install -y chromium-browser || true
          fi
          google-chrome --version || chromium --version || true

      - name: 🚀 Run Autonomous Video Pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
          PUTER_MODEL: ${{ secrets.PUTER_MODEL }}
          GOOGLE_FLOW_SESSION: ${{ secrets.GOOGLE_FLOW_SESSION }}
          SCRIPT_INPUT: ${{ inputs.script_text }}
          TITLE_INPUT: ${{ inputs.title }}
          VIBE_INPUT: ${{ inputs.custom_vibe }}
          NICHE_INPUT: ${{ inputs.poetry_niche }}
          TARGET_PAGE_INPUT: ${{ inputs.target_page }}
          PUBLISH_FB_INPUT: ${{ inputs.publish_facebook }}
          BULK_POEMS_INPUT: ${{ inputs.bulk_poems }}
          BULK_START_TIME_INPUT: ${{ inputs.bulk_start_time }}
          BULK_INTERVAL_INPUT: ${{ inputs.bulk_interval }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          xvfb-run -a python cloud_generator/github_runner.py

      - name: 💾 Commit & Push Updated Job Queue & History
        if: always()
        run: |
          git config --global user.name "Autonomous Studio Bot"
          git config --global user.email "bot@autovideostudio.internal"
          git add cloud_generator/jobs_queue.json cloud_generator/facebook_history.json || true
          if git diff --staged --quiet; then
            echo "No queue changes to commit."
          else
            git commit -m "🤖 Auto-update job queue & publication history [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: 📤 Upload Rendered Videos as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos-${{ github.run_number }}
          path: Output/*.mp4
          retention-days: 14
          if-no-files-found: ignore
